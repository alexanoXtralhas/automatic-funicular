name: Build X_Plarail 3.7.1 MENU_FIX Windows EXE

on:
  push:
    paths:
      - .github/workflows/x_plarail_371_windows_exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Recover and verify MENU_FIX source payload
        shell: pwsh
        run: |
          $code = @'
          import base64, hashlib, io, itertools, lzma, pathlib, tarfile

          root = pathlib.Path('build/minimal_tar_v2_parts')
          parts = [(root / f'q{i:02d}.txt').read_text(encoding='utf-8').strip() for i in range(8)]
          missing = [20000-len(p) for p in parts]
          print('chunk lengths=', [len(p) for p in parts], 'missing=', missing)
          if missing != [1,1,1,1,1,1,1,3]:
              raise SystemExit(f'unexpected v2 chunk-loss pattern: {missing}')

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def tar_prefix_ok(data: bytes) -> bool:
              pos = 0
              zero = b'\0' * 512
              while pos + 512 <= len(data):
                  h = data[pos:pos+512]
                  if h == zero:
                      return True
                  try:
                      stored = int(h[148:156].strip(b'\0 ') or b'0', 8)
                      calc = sum(h[:148]) + 256 + sum(h[156:])
                      if stored != calc:
                          return False
                      sf = h[124:136]
                      size = int.from_bytes(sf, 'big', signed=True) if (sf and sf[0] & 0x80) else int(sf.strip(b'\0 ') or b'0', 8)
                      if size < 0:
                          return False
                  except Exception:
                      return False
                  end = pos + 512 + ((size + 511)//512)*512
                  if end > len(data):
                      return True
                  pos = end
              return True

          def prefix_ok(guesses):
              corrected = [parts[i] + guesses[i] for i in range(len(guesses))]
              try:
                  raw = base64.b64decode(''.join(corrected), validate=True)
                  out = lzma.LZMADecompressor().decompress(raw)
                  return tar_prefix_ok(out)
              except Exception:
                  return False

          candidates = [()]
          for idx in range(7):
              nxt = []
              for prev in candidates:
                  for ch in alphabet:
                      g = prev + (ch,)
                      if prefix_ok(g):
                          nxt.append(g)
              candidates = nxt
              print(f'after q{idx:02d}: candidates={len(candidates)}')
              if not candidates or len(candidates) > 8192:
                  raise SystemExit(f'candidate search not selective at q{idx:02d}: {len(candidates)}')

          # Final Base64 quartet: only tails whose decoded last two bytes are XZ footer magic YZ.
          first = parts[7][-1]
          tails = []
          for abc in itertools.product(alphabet, repeat=3):
              tail = ''.join(abc)
              try:
                  if base64.b64decode(first + tail, validate=True)[-2:] == b'YZ':
                      tails.append(tail)
              except Exception:
                  pass
          print('q07 XZ-magic suffix candidates=', len(tails))

          expected = {
              'app.py':'1a779e34d7596df076ed11508b616eb5980ef8527ea9134d8daae36102aa6154',
              'x_plarail.spec':'63d8659bae7a30caded420d876b70e786d51660538f87f69188cc065bad2430f',
              'BUILD_EXE_WINDOWS.ps1':'d0b278eee27462c5f9c3188c64cc82b34b29079abfed8bc89f1f64d3dc2831b6',
              'requirements-build.txt':'662eb8a76b197a938657adf57d4c173c851536273d8ecbdf1fb33c4522d7ee37',
              'xplarail/ui.py':'6932cc3730ffd543f33b505ec89ff64f109841c57d4eaa84b841582753940763',
              'xplarail/services.py':'3baafdd09c829056546f36fb619a487322376a84c39ed8fc01f14268dc374545',
              'data/x_plarail.db':'fbb284f482b7795d3b76b267d8a5dd1e62109c96a026e80f4dc80c32361508a2',
              'docs/CORE_BASELINE_SHA256.json':'2f6c15053ffe5b24eea68452c62c814726ad0ef6a859a7d972384591e7c029bd',
              'installer/windows_version_info.txt':'84170f8d623960f6124fdf1452429474652727c957cad31b83f3c7893dd5d2eb',
          }

          solutions=[]
          for g in candidates:
              corrected=''.join(parts[i]+g[i] for i in range(7))
              for tail in tails:
                  try:
                      raw=base64.b64decode(corrected + parts[7] + tail, validate=True)
                      payload=lzma.decompress(raw)
                      with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as tf:
                          members={m.name:m for m in tf.getmembers() if m.isfile()}
                          ok=True
                          for name,h in expected.items():
                              m=members.get(name)
                              f=tf.extractfile(m) if m else None
                              if f is None or hashlib.sha256(f.read()).hexdigest()!=h:
                                  ok=False; break
                          if ok:
                              solutions.append((g,tail,raw,payload))
                  except Exception:
                      pass
          print('fully hash-verified solutions=',len(solutions))
          if len(solutions)!=1:
              raise SystemExit(f'expected one verified payload, got {len(solutions)}')

          g,tail,raw,payload=solutions[0]
          print('recovered chars=', ''.join(g)+tail)
          print('recovered xz sha256=',hashlib.sha256(raw).hexdigest())
          out=pathlib.Path('buildsrc'); out.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as tf:
              for m in tf.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {m.name}')
              tf.extractall(out)
          print('payload extraction + critical SHA verification: PASS')
          '@
          $code | python -
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic source recovery failed.' }

      - name: Verify source syntax and MENU_FIX
        shell: pwsh
        working-directory: buildsrc
        run: |
          python -m compileall -q app.py xplarail xtralhas_core xtralhas_plugins
          if ($LASTEXITCODE -ne 0) { throw 'Source compileall failed.' }
          $ui = Get-Content .\xplarail\ui.py -Raw -Encoding UTF8
          foreach ($needle in @('nav_scrollbar','_sidebar_mousewheel','_refresh_sidebar_scrollbar')) {
            if (-not $ui.Contains($needle)) { throw "MENU_FIX marker missing: $needle" }
          }
          Write-Host 'Source syntax + expanded sidebar MENU_FIX: PASS'

      - name: Install build requirements
        shell: pwsh
        working-directory: buildsrc
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Source self-test
        shell: pwsh
        working-directory: buildsrc
        run: |
          python app.py --self-test --report-file .\source-self-test.json
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }
          $r=Get-Content .\source-self-test.json -Raw -Encoding UTF8|ConvertFrom-Json
          if ($r.status-ne'PASS' -or $r.version-ne'3.7.1' -or $r.schema_version-ne 360){throw 'Source identity mismatch.'}

      - name: Build native Windows executable
        shell: pwsh
        working-directory: buildsrc
        run: powershell -ExecutionPolicy Bypass -File .\BUILD_EXE_WINDOWS.ps1 -CleanEnvironment

      - name: Frozen EXE self-test
        shell: pwsh
        working-directory: buildsrc
        run: |
          $exe='.\dist\X_Plarail_Collection_OS\X_Plarail_Collection_OS.exe'
          if(-not(Test-Path $exe)){throw 'Frozen EXE not produced.'}
          & $exe --self-test --report-file .\exe-self-test.json
          if($LASTEXITCODE-ne 0){throw 'Frozen EXE self-test failed.'}
          $r=Get-Content .\exe-self-test.json -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.status-ne'PASS' -or $r.version-ne'3.7.1' -or $r.schema_version-ne 360){throw 'Frozen EXE identity mismatch.'}

      - name: Frozen runtime identity and portable package
        shell: pwsh
        working-directory: buildsrc
        run: |
          $dir='.\dist\X_Plarail_Collection_OS';$exe=Join-Path $dir 'X_Plarail_Collection_OS.exe'
          & $exe --runtime-info --report-file .\runtime-info.json
          if($LASTEXITCODE-ne 0){throw 'Runtime info failed.'}
          $r=Get-Content .\runtime-info.json -Raw -Encoding UTF8|ConvertFrom-Json
          if(-not $r.frozen -or $r.version-ne'3.7.1' -or $r.schema_version-ne 360){throw 'Frozen runtime identity mismatch.'}
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant();$hash|Set-Content .\EXE_SHA256.txt -Encoding ascii
          Copy-Item .\exe-self-test.json (Join-Path $dir 'FROZEN_SELF_TEST_3_7_1.json')
          Copy-Item .\runtime-info.json (Join-Path $dir 'RUNTIME_INFO_3_7_1.json')
          Copy-Item .\EXE_SHA256.txt (Join-Path $dir 'SHA256_EXE_3_7_1.txt')
          Compress-Archive -Path "$dir\*" -DestinationPath .\X_Plarail_Collection_OS_3_7_1_MENU_FIX_WINDOWS_PORTABLE.zip -Force
          Write-Host "EXE_SHA256=$hash"

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: X_Plarail_3_7_1_MENU_FIX_WINDOWS
          path: |
            buildsrc/dist/X_Plarail_Collection_OS/**
            buildsrc/X_Plarail_Collection_OS_3_7_1_MENU_FIX_WINDOWS_PORTABLE.zip
            buildsrc/EXE_SHA256.txt
            buildsrc/exe-self-test.json
            buildsrc/runtime-info.json
          if-no-files-found: error
          retention-days: 14
